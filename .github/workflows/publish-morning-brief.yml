name: Publish Morning Brief

on:
  push:
    branches: [main]
    paths:
      - "morning-brief/**"
      - "ops-portal-a7c93e4b16f28d05c4e9713b/**"
      - "assets/**"
      - "index.html"
      - "qwick-shift-rush.html"
      - "robots.txt"
      - ".github/workflows/publish-morning-brief.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the public site with Morning Brief at its stable path
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='_site/' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
