name: Refresh VIP + BF5 dashboards

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-vip-bf5-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh BF5 from the sheets
        run: python3 scripts/refresh_dashboard.py

      - name: Refresh VIP from the sheets
        run: python3 scripts/refresh_vip.py

      - name: Verify the public build contains no Pro contact details
        run: python3 scripts/sanitize_public_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "shift-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- ops-portal-a7c93e4b16f28d05c4e9713b/bf5.html ops-portal-a7c93e4b16f28d05c4e9713b/vip.html; then
            echo "No data changes."
            exit 0
          fi
          git add ops-portal-a7c93e4b16f28d05c4e9713b/bf5.html ops-portal-a7c93e4b16f28d05c4e9713b/vip.html
          git commit -m "Manually refresh VIP and BF5 dashboard data"
          git push
