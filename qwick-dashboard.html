<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Qwick Magic Team Dashboard",
  "schemaVersion": 1
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwick Magic Team Dashboard</title>
<link rel="stylesheet" href="assets/dashboard-interactions.css">
<script defer src="assets/dashboard-interactions.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #FBF3E7;
    --card: #ffffff;
    --border: #e8dfcd;
    --text: #262626;
    --muted: #8a8272;
    --accent: #3F7A4E;
    --green-bg: #e8f3ea;
    --gray-bg: #f2ede0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  header.hub-head {
    padding: 22px 28px 0;
  }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: 13px; }

  nav.top-tabs {
    display: flex;
    gap: 6px;
    padding: 18px 28px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .top-tab {
    appearance: none; border: none; background: none; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 700; color: var(--muted);
    padding: 10px 18px; border-radius: 10px 10px 0 0; position: relative; top: 1px;
    white-space: nowrap;
  }
  .top-tab:hover { color: var(--text); }
  .top-tab.active {
    color: var(--accent); background: var(--card);
    border: 1px solid var(--border); border-bottom-color: var(--card);
  }
  .top-tab-link {
    align-self: center;
    margin-left: auto;
    margin-bottom: 7px;
    border-radius: 999px;
    padding: 7px 13px;
    color: #fff;
    background: var(--accent);
    text-decoration: none;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 800;
  }
  .top-tab-link:hover { background: #315f3d; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  nav.sub-tabs {
    display: flex; gap: 8px; align-items: center;
    padding: 16px 28px 0;
  }
  .sub-tabs-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 6px; }
  .sub-tab {
    appearance: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 700;
    color: var(--text); background: var(--gray-bg); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 20px;
  }
  .sub-tab:hover { border-color: var(--accent); }
  .sub-tab.active { color: var(--accent); background: var(--green-bg); border-color: var(--accent); }
  .sub-tab.coming-soon { color: var(--muted); cursor: default; }
  .sub-tab.coming-soon:hover { border-color: var(--border); }

  .sub-panel { display: none; }
  .sub-panel.active { display: block; }

  .embed-frame {
    display: block; width: 100%; border: 0; background: var(--bg);
    min-height: clamp(360px, 65vh, 760px);
  }
  .embed-loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--muted); font-size: 13px;
  }

  footer.hub-foot {
    padding: 16px 28px 40px; font-size: 11.5px; color: var(--muted); text-align: center;
  }
  .brand-mark {
    height: 20px;
    width: auto;
    display: block;
    margin-bottom: 8px;
  }

  .agent-status-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 28px; background: var(--green-bg); border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .agent-status-bar.empty { display: none; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
    animation: liveDotPulse 2s infinite;
  }
  @keyframes liveDotPulse {
    0% { box-shadow: 0 0 0 0 rgba(63,122,78,.45); }
    70% { box-shadow: 0 0 0 6px rgba(63,122,78,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,122,78,0); }
  }
  .agent-status-label { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .agent-chip-row { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .agent-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 2px 10px; color: var(--text); font-weight: 600; white-space: nowrap; font-size: 11.5px;
  }
  .agent-chip .until { color: var(--muted); font-weight: 500; }
  .agent-status-snapshot { color: var(--muted); font-size: 10.5px; white-space: nowrap; margin-left: auto; }
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;z-index:99999;background:var(--bg,#FBF3E7);display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <form id="authForm" style="background:var(--card,#fff);border:1px solid var(--border,#e8dfcd);border-radius:12px;padding:28px 32px;display:flex;flex-direction:column;gap:12px;width:260px;box-shadow:0 8px 24px rgba(0,0,0,.1);">
    <div style="font-weight:700;font-size:15px;color:var(--text,#262626);">Enter password</div>
    <input id="authInput" type="password" autocomplete="current-password" placeholder="Password" style="padding:9px 12px;border:1px solid var(--border,#e8dfcd);border-radius:8px;font-size:14px;">
    <div id="authError" style="color:var(--red,#d64545);font-size:12.5px;display:none;">Incorrect password.</div>
    <button type="submit" style="background:var(--accent,#3F7A4E);color:#fff;border:none;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer;font-size:13.5px;">Unlock</button>
  </form>
</div>
<script>
(function () {
  var PASSWORD = 'Ch3f';
  var STORAGE_KEY = 'qwickDashboardAuthed';
  var gate = document.getElementById('authGate');
  // Defensive: if this page were ever itself embedded in another frame, trust
  // the parent's gate instead of showing our own (see index.html/
  // housekeeping-outreach.html for why a nested gate breaks visually).
  if (window.self !== window.top) { gate.remove(); return; }
  if (localStorage.getItem(STORAGE_KEY) === 'yes') { gate.remove(); return; }
  document.getElementById('authForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('authInput');
    if (input.value === PASSWORD) {
      localStorage.setItem(STORAGE_KEY, 'yes');
      gate.remove();
    } else {
      document.getElementById('authError').style.display = 'block';
      input.value = '';
      input.focus();
    }
  });
})();
</script>


<header class="hub-head">
  <img class="brand-mark" src="assets/qwick-logo.png" alt="Qwick">
  <h1>Qwick Magic Team Dashboard</h1>
  <div class="subtitle">One place for Business First 5 and every Magic Team special-task dashboard.</div>
</header>

<div class="agent-status-bar" id="agentStatusBar">
  <span class="live-dot"></span>
  <span class="agent-status-label">Online now</span>
  <div class="agent-chip-row" id="agentChipRow"></div>
  <span class="agent-status-snapshot" id="agentSnapshot" data-snapshot-utc="2026-08-15T21:59:35Z"></span>
</div>

<nav class="top-tabs" id="topTabs">
  <button class="top-tab" data-tab="bf5">Business First 5</button>
  <button class="top-tab" data-tab="vip">VIP</button>
  <button class="top-tab" data-tab="magic">Magic Team Special Tasks</button>
  <button class="top-tab" data-tab="game">Shift Rush Game</button>
  <a class="top-tab-link" href="qwick-shift-rush.html" target="_blank" rel="noopener">Play Shift Rush ↗</a>
</nav>

<section class="tab-panel" id="tab-bf5">
  <iframe class="embed-frame" data-src="index.html" title="Business First 5 Shifts Dashboard"></iframe>
</section>

<section class="tab-panel" id="tab-vip">
  <iframe class="embed-frame" data-src="vip-outreach.html" title="VIP Pro Outreach Dashboard"></iframe>

<section class="tab-panel" id="tab-magic">
  <nav class="sub-tabs" id="magicSubTabs"><span class="sub-tabs-label">Special task:</span></nav>
  <div id="magicSubPanels"></div>
</section>

<section class="tab-panel" id="tab-game">
  <iframe class="embed-frame" data-src="qwick-shift-rush.html" title="Qwick Shift Rush hospitality game"></iframe>
</section>

<footer class="hub-foot">Each tab loads its own dashboard, which keeps refreshing on its own schedule &mdash; nothing here changes that.</footer>

<script>
// ---- Who's online: Pro Success / MOPS agents currently clocked in ----
// Populated by scripts/refresh_agents.py from the Magic Schedule sheet
// (who's scheduled today, in EST) cross-checked against the DTR sheet
// (who's actually clocked in right now). Only agents who are both
// scheduled today and currently clocked in appear here.
const AGENT_STATUS = [];

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

(function renderAgentStatus() {
  const bar = document.getElementById('agentStatusBar');
  const row = document.getElementById('agentChipRow');
  if (!AGENT_STATUS.length) { bar.classList.add('empty'); return; }
  row.innerHTML = AGENT_STATUS.map(a =>
    `<span class="agent-chip">${escapeHtml(a.name)} <span class="until">until ${escapeHtml(a.until)} EST</span></span>`
  ).join('');

  const snap = document.getElementById('agentSnapshot');
  const iso = snap.dataset.snapshotUtc;
  if (iso) {
    const d = new Date(iso);
    if (!isNaN(d)) {
      snap.textContent = 'as of ' + d.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    }
  }
})();

// Add a new Magic Team special-task dashboard by adding one entry here.
// `src: null` renders a "coming soon" sub-tab with no iframe yet.
const MAGIC_TASKS = [
  { id: 'housekeeping', label: 'Housekeeping', src: 'housekeeping-outreach.html' },
];

const magicSubTabsEl = document.getElementById('magicSubTabs');
const magicSubPanelsEl = document.getElementById('magicSubPanels');

MAGIC_TASKS.forEach((task, i) => {
  const btn = document.createElement('button');
  btn.className = 'sub-tab' + (task.src ? '' : ' coming-soon') + (i === 0 ? ' active' : '');
  btn.dataset.subtab = task.id;
  btn.textContent = task.label + (task.src ? '' : ' (coming soon)');
  if (task.src) btn.addEventListener('click', () => activateSubTab(task.id));
  magicSubTabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'sub-panel' + (i === 0 ? ' active' : '');
  panel.id = 'subpanel-' + task.id;
  if (task.src) {
    const iframe = document.createElement('iframe');
    iframe.className = 'embed-frame';
    iframe.dataset.src = task.src;
    iframe.title = task.label + ' dashboard';
    panel.appendChild(iframe);
  } else {
    const placeholder = document.createElement('div');
    placeholder.className = 'embed-loading';
    placeholder.textContent = task.label + ' dashboard coming soon.';
    panel.appendChild(placeholder);
  }
  magicSubPanelsEl.appendChild(panel);
});

function activateSubTab(id) {
  document.querySelectorAll('#magicSubTabs .sub-tab').forEach(el => el.classList.toggle('active', el.dataset.subtab === id));
  document.querySelectorAll('.sub-panel').forEach(el => el.classList.toggle('active', el.id === 'subpanel-' + id));
  loadFrame(document.querySelector('#subpanel-' + id + ' iframe'));
  setHash('magic', id);
}

// ---- Lazy-load + auto-resize iframes so embedded pages don't get a nested scrollbar ----
function loadFrame(iframe) {
  if (!iframe || iframe.dataset.loaded === 'true') return;
  iframe.dataset.loaded = 'true';
  let interval;
  const resize = () => {
    try {
      const doc = iframe.contentWindow.document;
      const height = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (height > 0) iframe.style.height = Math.ceil(height) + 'px';
    } catch (e) { /* not expected same-origin, but don't break the tab if it happens */ }
  };
  iframe.addEventListener('load', () => {
    resize();
    let tries = 0;
    clearInterval(interval);
    interval = setInterval(() => { resize(); if (++tries > 20) clearInterval(interval); }, 250);
    iframe.contentWindow.postMessage({ type: 'qwick:request-frame-height' }, '*');
  });
  iframe.src = iframe.dataset.src;
  requestAnimationFrame(resize);
}

// Embedded dashboards also report their own height. This closes the fast local-file
// load race and keeps the frame in sync as tables, images, and panels change size.
window.addEventListener('message', event => {
  const data = event.data;
  if (!data || data.type !== 'qwick:frame-height') return;
  const iframe = [...document.querySelectorAll('.embed-frame')]
    .find(candidate => candidate.contentWindow === event.source);
  const height = Number(data.height);
  if (!iframe || !Number.isFinite(height) || height < 200 || height > 50000) return;
  iframe.style.height = Math.ceil(height) + 'px';
});

// ---- Top-level tab switching ----
function activateTopTab(id) {
  document.querySelectorAll('#topTabs .top-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.toggle('active', el.id === 'tab-' + id));
  if (id === 'magic') {
    const activeSub = document.querySelector('#magicSubTabs .sub-tab.active');
    if (activeSub) loadFrame(document.querySelector('#subpanel-' + activeSub.dataset.subtab + ' iframe'));
    setHash(id, activeSub && activeSub.dataset.subtab);
  } else {
    loadFrame(document.querySelector('#tab-' + id + ' iframe'));
    setHash(id);
  }
}

document.querySelectorAll('#topTabs .top-tab').forEach(btn => {
  btn.addEventListener('click', () => activateTopTab(btn.dataset.tab));
});

// ---- Shareable deep links: #bf5, #vip, #magic, or #magic/housekeeping ----
function setHash(top, sub) {
  const next = '#' + top + (sub ? '/' + sub : '');
  if (location.hash !== next) history.replaceState(null, '', next);
}

function routeFromHash() {
  const [top, sub] = location.hash.replace(/^#/, '').split('/');
  if (top === 'magic') {
    activateTopTab('magic');
    if (sub && document.querySelector(`.sub-tab[data-subtab="${sub}"]`)) activateSubTab(sub);
  } else if (top && document.querySelector(`#topTabs .top-tab[data-tab="${top}"]`)) {
    activateTopTab(top);
  } else {
    activateTopTab('bf5');
  }
}

routeFromHash();
</script>
</body>
</html>
